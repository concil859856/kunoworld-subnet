[project]
name = "kuno-worker"
version = "0.1.0"
description = "KunoWorld miner worker: runs inside the confidential VM, decrypts jobs, generates video, seals the output"
requires-python = ">=3.10"
dependencies = [
    "kuno-protocol",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
kuno-worker = "kuno_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuno_worker"]
