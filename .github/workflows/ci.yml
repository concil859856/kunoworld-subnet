name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Installed directly rather than as a workspace: this repo is also a member of the
      # development workspace, and a package can only belong to one.
      - run: uv venv
      - run: uv pip install -e protocol -e worker -e validator pytest
      - run: uv run pytest protocol/tests worker/tests validator/tests -q
