# KunoWorld CVM root filesystem, built with mkosi 26 at the revision pinned in ../inputs.lock.json.
# build.sh adds the Debian snapshot (--include of a generated pins file) and SOURCE_DATE_EPOCH, and
# turns the output directory into the release bytes with pack-rootfs.sh and mkinitrd.sh (the initrd
# takes busybox, veritysetup and their libraries from this same tree). Layout after dstack's
# os/mkosi/mkosi.conf (Apache-2.0), with a much smaller package set: no Docker, ZFS, Sysbox or tooling.
#
# NOT BUILT IN THIS REPOSITORY'S CI BY DEFAULT: .github/workflows/cvm-reproducibility.yml runs it on demand.
[Config]
MinimumVersion=26

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,non-free-firmware

[Output]
Format=directory
ImageId=kuno-cvm
Output=rootfs
CompressOutput=no
# Empty: the kernel comes from mkosi.build, not from a split of this tree.
SplitArtifacts=

[Content]
Bootable=no
Hostname=kuno-cvm
Packages=
        systemd
        systemd-sysv
        dbus
        ca-certificates
        bash
        coreutils
        util-linux
        iproute2
        nftables
        chrony
        kmod
        jq
        tar
        cryptsetup-bin
        busybox-static
        podman
        crun
        catatonit
        pciutils
BuildPackages=
        gcc
        make
        bc
        bison
        flex
        dwarves
        libelf-dev
        libssl-dev
        cpio
        kmod
        perl
        python3
        xz-utils
        zstd
        git
        golang-go
        ca-certificates
ExtraTrees=../rootfs:/
RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /var/cache/apt
        /var/lib/apt/lists
CleanPackageMetadata=yes
WithDocs=no
Locale=C.UTF-8
Timezone=UTC

[Build]
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
ToolsTreePackages=
        cpio
        cryptsetup-bin
        gzip
        squashfs-tools
        tar
WithNetwork=yes
BuildSources=../.inputs:inputs
        ../kernel:kernel
        ../nvidia.files:nvidia.files
BuildSourcesEphemeral=yes
Incremental=no
History=no
