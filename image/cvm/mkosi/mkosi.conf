# KunoWorld CVM root filesystem, built with mkosi 26 at the revision pinned in ../inputs.lock.json.
# build.sh runs mkosi on a copy of this directory in its scratch space (mkosi 26 writes the default tools tree next
# to the configuration), and adds through a generated --include the Debian snapshot and the inputs directory as a
# build source. It passes SOURCE_DATE_EPOCH and a tools-tree sandbox tree whose apt sources name the same snapshot
# and the pinned Debian archive keyring: mkosi hands neither Snapshot= nor the output directory down to the tools
# tree. It turns the output directory into the release bytes with
# pack-rootfs.sh and mkinitrd.sh, run inside the tools tree (the initrd takes busybox, veritysetup and their
# libraries from this same tree). Layout after dstack's os/mkosi/mkosi.conf (Apache-2.0), with a much smaller
# package set: no Docker, ZFS, Sysbox or tooling.
[Config]
MinimumVersion=26

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,non-free-firmware

[Output]
Format=directory
ImageId=kuno-cvm
Output=rootfs
CompressOutput=no
# Empty: the kernel comes from mkosi.build, not from a split of this tree.
SplitArtifacts=

[Content]
Bootable=no
Hostname=kuno-cvm
Packages=
        systemd
        systemd-sysv
        dbus
        ca-certificates
        bash
        coreutils
        util-linux
        iproute2
        nftables
        chrony
        kmod
        jq
        tar
        cryptsetup-bin
        busybox-static
        podman
        crun
        catatonit
        pciutils
        # Protected PCIe: NVIDIA's PPCIe verifier (python3 and the packages it imports that Debian ships) and the
        # libraries nvattest links (dstack's list for xmlsec, and libstdc++, which no other package here pulls in).
        python3
        python3-cryptography
        python3-ecdsa
        python3-prettytable
        libstdc++6
        libcurl4t64
        libxmlsec1t64
        libxmlsec1t64-openssl
# Rust and Go are not here: mkosi.build installs pinned upstream toolchains, because trixie's rustc (1.85) is too old
# for nvattest's locked crates and its Go (1.24) for nvidia-container-toolkit's go.mod.
BuildPackages=
        gcc
        make
        bc
        bison
        flex
        dwarves
        libelf-dev
        libssl-dev
        cpio
        kmod
        perl
        python3
        xz-utils
        zstd
        git
        ca-certificates
        # nvattest (dstack's nvattest component: cmake, ninja, the toolchain and these headers)
        g++
        cmake
        ninja-build
        pkg-config
        patch
        libcurl4-openssl-dev
        libxml2-dev
        libxmlsec1-dev
ExtraTrees=../rootfs:/
RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /var/cache/apt
        /var/lib/apt/lists
        # Build times and inode numbers, which differed between two builds; dstack removes the same files. /var is a
        # tmpfs at runtime (rootfs/etc/fstab), so nothing reads them.
        /var/cache/ldconfig/aux-cache
        /var/log/alternatives.log
        /var/log/dpkg.log
        /var/log/apt
CleanPackageMetadata=yes
WithDocs=no
Locale=C.UTF-8
Timezone=UTC

[Build]
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# As dstack: mkosi's general-purpose tools and the packing tools below, no VM runtimes or other distributions'
# package managers.
ToolsTreeProfiles=misc
ToolsTreePackages=
        cpio
        cryptsetup-bin
        gzip
        python3
        squashfs-tools
        tar
WithNetwork=yes
# build.sh adds <inputs>:inputs. image/cvm itself is mounted for kernel/kuno.config and nvidia.files, because
# BuildSources= takes directories only.
BuildSources=..:cvm
BuildSourcesEphemeral=yes
Incremental=no
History=no
