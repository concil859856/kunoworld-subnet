# Pins the exact Python environment baked into the worker images (/opt/kuno). Not a workspace member:
# it locks on its own so the image build needs only this repository.
# `gpu` is the model runtime for KUNO_BACKEND=real: CUDA 12.8 torch, torchaudio and torchao from PyTorch's index
# (worker/pyproject.toml), diffusers, transformers, accelerate and PyAV.
# `safety` runs the content safety classifiers baked into the images (transformers, timm, and torchvision from
# the same CUDA 12.8 index); `provenance` embeds C2PA manifests (KUNO_PROVENANCE=c2pa).
# `peft` lets diffusers load LightX2V's Turbo LoRA into the MiniMax H3 pipeline (`load_lora_weights`; diffusers 0.40
# requires peft 0.17.0 or newer). The worker runs that pipeline only for h3-turbo in verified mode; SGLang serves the
# LoRA otherwise.
# SGLang, for the H3 image, has its own lock: image/sglang/uv.lock.
[project]
name = "kuno-worker-image"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["kuno-worker[nvidia,gpu,safety,provenance]", "kuno-protocol", "peft>=0.17.0"]

[tool.uv]
package = false
# The image is linux/amd64 (image/build.sh); torchao's CUDA wheel is x86-64 only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
kuno-protocol = { path = "../protocol", editable = false }
kuno-worker = { path = "../worker", editable = false }
