[project]
name = "kuno-protocol"
version = "0.1.0"
description = "Shared wire protocol for KunoWorld: encryption, jobs, model profiles, attestation, receipts"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyhpke>=0.6",
    "cryptography>=42",
]

[project.scripts]
kuno-devkit = "kuno_protocol.devkit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuno_protocol"]
