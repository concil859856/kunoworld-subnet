[project]
name = "kuno-protocol"
version = "0.1.0"
description = "Shared wire protocol for KunoWorld: encryption, jobs, model profiles, attestation, receipts"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyhpke>=0.6",
    "cryptography>=42",
    # sr25519, to verify Bittensor hotkey proofs (small Rust wheel, no dependencies).
    "py-sr25519-bindings>=0.2.4",
]

[project.optional-dependencies]
# Intel DCAP quote verification for gateways and validators (Rust wheel, no dependencies).
tdx = ["dcap-qvl>=0.6.3"]

[project.scripts]
kuno-devkit = "kuno_protocol.devkit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuno_protocol"]
